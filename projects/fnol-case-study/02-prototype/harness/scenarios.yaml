# 44 test conversations. A simulated customer plays each brief; a judge grades the transcript.
#
# brief:   what the simulated customer knows and how they behave (only revealed when asked, unless noted)
# opening: the customer's first message
# expect:  what good looks like, for the judge
# checks:  automatic checks on tool calls
#   must_call / must_not_call: tool names
#   handoff_reason: allowed reasons if handoff_to_human is called
#   order: [a, b] means the first call to a happens before the first call to b
# inject:  [{after_sam_turn: N, text: "..."}]: the exact customer line sent after Sam's Nth reply.
#           Use it when the simulated customer might skip a scripted trigger. If the chat ends before
#           the line is delivered, the run is invalid and isn't saved.

# ---------- Happy path ----------
- id: HP01
  category: happy_path
  title: Parked car hit, other driver left a note
  outages: []
  brief: >
    You are Priya Sharma, calm and organised. Policy number WTL456789. Your Mazda 3 (123ABC) was hit by a
    reversing car at Westfield Carindale yesterday about 4pm while parked; rear bumper cracked. The driver left
    a note: James, 0412 345 678, rego 789GHI. Car is drivable. Nobody hurt. No police.
  opening: Hi, I need to lodge a claim. Someone reversed into my car at Westfield Carindale yesterday arvo. Rear bumper's cracked.
  expect: Efficient, story-first, asks which car, confirms date as Tuesday 27 October, confirms summary, lodges, gives claim number and next step.
  checks: {must_call: [verify_identity, create_claim], order: [verify_identity, create_claim]}


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" width="100%" role="img" aria-labelledby="effort-t effort-d">
<title id="effort-t">Simulated: Sam turns, questions and repeat questions (mean per conversation)</title>
<desc id="effort-d">Simulated pilot. Mean Sam turns, questions and repeat questions per conversation, by variant.</desc>
<style>
.ab-text { fill: #18241f; font: 16px system-ui, Arial, sans-serif; }
.ab-title { font-size: 18px; font-weight: 700; }
